<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SANUSI</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,"Noto Sans Malayalam",sans-serif;background:radial-gradient(circle at 50% 30%,#eef5ff,#b7cff5);color:#1b2a4a;text-align:center}
h1{margin:10px 0 0;font-size:26px;letter-spacing:4px}
#stage svg{height:50vh;max-width:92vw}
#st{font-size:18px;min-height:26px;font-weight:600;color:#2563eb}
#q{font-size:14px;color:#5b6b88;min-height:20px;padding:0 14px}
#a{font-size:20px;min-height:56px;padding:0 16px;max-width:760px;margin:0 auto}
.b{font-size:17px;padding:12px 18px;border:0;border-radius:26px;background:#2563eb;color:#fff;margin:5px;cursor:pointer}
.b.on{background:#16a34a}
.note{font-size:12px;color:#5b6b88;margin:10px 8px}
#cam{position:fixed;left:8px;bottom:8px;width:84px;height:63px;border-radius:10px;object-fit:cover;transform:scaleX(-1);display:none;opacity:.85;border:2px solid #fff}
body.full h1,body.full .note{display:none}
body.full #stage svg{height:66vh}
body.full .btns{opacity:.4}
</style>
</head>
<body>
<h1>SANUSI</h1>
<div id="stage">
<svg id="rb" viewBox="0 0 240 360" xmlns="http://www.w3.org/2000/svg">
<style>.w{fill:#fff;stroke:#9aa8bd;stroke-width:2.5}</style>
<ellipse cx="120" cy="346" rx="62" ry="8" fill="#000" opacity=".12"/>
<rect class="w" x="95" y="216" width="22" height="108" rx="11"/>
<rect class="w" x="123" y="216" width="22" height="108" rx="11"/>
<ellipse class="w" cx="104" cy="330" rx="20" ry="9"/>
<ellipse class="w" cx="136" cy="330" rx="20" ry="9"/>
<g id="bodyG">
<rect class="w" x="78" y="112" width="84" height="112" rx="34"/>
<ellipse cx="120" cy="172" rx="26" ry="30" fill="#eef3fb" stroke="#c3cede" stroke-width="2"/>
<circle id="lt" cx="120" cy="150" r="6" fill="#22d3ee"/>
</g>
<g id="armL"></g>
<g id="armR"></g>
<g id="headG">
<line x1="120" y1="20" x2="120" y2="8" stroke="#9aa8bd" stroke-width="3"/>
<circle cx="120" cy="6" r="5" fill="#22d3ee"/>
<rect x="108" y="104" width="24" height="12" fill="#cfd8e6"/>
<circle cx="66" cy="64" r="8" fill="#e6ecf5" stroke="#9aa8bd" stroke-width="2"/>
<circle cx="174" cy="64" r="8" fill="#e6ecf5" stroke="#9aa8bd" stroke-width="2"/>
<rect class="w" x="68" y="20" width="104" height="88" rx="38"/>
<rect x="80" y="34" width="80" height="60" rx="26" fill="#16223d"/>
<ellipse id="eL" cx="104" cy="58" rx="7.5" ry="9.5" fill="#22d3ee"/>
<ellipse id="eR" cx="136" cy="58" rx="7.5" ry="9.5" fill="#22d3ee"/>
<circle cx="91" cy="76" r="5" fill="#fb7185" opacity=".35"/>
<circle cx="149" cy="76" r="5" fill="#fb7185" opacity=".35"/>
<path id="mo" fill="none" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
</div>
<div id="st"></div>
<div id="q"></div>
<div id="a"></div>
<div class="btns">
<button class="b" id="micBtn"></button>
<button class="b" id="langBtn"></button>
<button class="b" id="camBtn"></button>
<button class="b" id="fullBtn"></button>
</div>
<video id="cam" playsinline muted></video>
<p class="note">SANUSIYYA ടീം · നിർമ്മാണം: അസ്ജദ് ഫർഹാൻ · ഉത്തരങ്ങൾ നിർമിതബുദ്ധി തയ്യാറാക്കുന്നതാണ്</p>

<script>
var API='https://sanusi-ai.asjadfarhan996.workers.dev';
var $=function(i){return document.getElementById(i)};
var LANG='ml';
var T={
 ml:{talk:'പറയുന്നു…',think:'ആലോചിക്കുന്നു…',listen:'കേൾക്കുന്നു… ചോദിക്കൂ',wait:'തയ്യാർ',idle:'താഴെയുള്ള ബട്ടൺ അമർത്തൂ',
  micOn:'🎤 സംസാരിച്ചു തുടങ്ങൂ',micOff:'⏹ മൈക്ക് നിർത്തുക',camOn:'📷 ക്യാമറ ഓൺ',camOff:'📷 ക്യാമറ ഓഫ്',full:'⛶ പൂർണ സ്ക്രീൻ',lang:'🌐 ഭാഷ: സ്വയം',
  hello:'എന്തൊക്കെയുണ്ട് buddy സുഖമല്ലേ?',
  quota:'ഇപ്പോൾ ഒരുപാട് പേർ ചോദിക്കുന്നു. ഒരു നിമിഷം കഴിഞ്ഞ് വീണ്ടും ചോദിക്കൂ.',err:'ക്ഷമിക്കണം, ഉത്തരം കിട്ടിയില്ല. ഒന്നുകൂടി ചോദിക്കൂ.',
  deny:'മൈക്ക് ഉപയോഗിക്കാൻ അനുമതി കിട്ടിയില്ല. ബ്രൗസറിന്റെ അനുമതി നൽകൂ.',nosr:'ഈ ബ്രൗസറിൽ ശബ്ദം തിരിച്ചറിയില്ല. ക്രോം ഉപയോഗിക്കൂ.',
  camdeny:'ക്യാമറ ഉപയോഗിക്കാൻ അനുമതി കിട്ടിയില്ല.',nocam:'ഈ ബ്രൗസറിൽ ക്യാമറ ലഭ്യമല്ല.'},
 en:{talk:'Speaking…',think:'Thinking…',listen:'Listening… ask me',wait:'Ready',idle:'Press the button below',
  micOn:'🎤 Start talking',micOff:'⏹ Stop mic',camOn:'📷 Camera on',camOff:'📷 Camera off',full:'⛶ Full screen',lang:'🌐 English only',
  hello:'Hey buddy, how are you doing?',
  quota:'Many people are asking right now. Please try again in a moment.',err:'Sorry, I could not get an answer. Please ask again.',
  deny:'Microphone permission was not given. Please allow it in the browser.',nosr:'This browser cannot recognise speech. Please use Chrome.',
  camdeny:'Camera permission was not given.',nocam:'Camera is not available in this browser.'}
};
function tx(){return T[LANG]}

/* ---------- robot ---------- */
var armL=$('armL'),armR=$('armR'),headG=$('headG'),bodyG=$('bodyG'),eL=$('eL'),eR=$('eR'),mo=$('mo'),lt=$('lt');
function arm(){
 var s='',i,a,x,y,l;
 s+='<rect x="-7" y="-4" width="14" height="64" rx="7" fill="#fff" stroke="#9aa8bd" stroke-width="2.5"/>';
 for(i=0;i<5;i++){
  a=(-50+i*25)*Math.PI/180; l=(i===0)?17:22;
  x=(Math.sin(a)*l).toFixed(1); y=(68+Math.cos(a)*l).toFixed(1);
  s+='<line x1="0" y1="68" x2="'+x+'" y2="'+y+'" stroke="#9aa8bd" stroke-width="7" stroke-linecap="round"/>';
  s+='<line x1="0" y1="68" x2="'+x+'" y2="'+y+'" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>';
 }
 s+='<circle cx="0" cy="68" r="11" fill="#fff" stroke="#9aa8bd" stroke-width="2.5"/>';
 s+='<circle cx="0" cy="0" r="9" fill="#e6ecf5" stroke="#9aa8bd" stroke-width="2.5"/>';
 return s;
}
armL.innerHTML=arm(); armR.innerHTML=arm();

var MOUTH={s:'M110 76 Q120 84 130 76',l:'M113 77 Q120 82 127 77',t:'M112 78 L128 78',p0:'M112 76 Q120 82 128 76',p1:'M111 74 Q120 92 129 74 Z'};
function face(k,bl,lk){
 var ry=9.5,cy=58;
 if(k==='l')ry=11.5;
 if(k==='t'){cy=54;ry=8;}
 eL.setAttribute('cx',104+lk*5); eR.setAttribute('cx',136+lk*5);
 eL.setAttribute('cy',cy); eR.setAttribute('cy',cy);
 eL.setAttribute('ry',Math.max(.8,ry*bl)); eR.setAttribute('ry',Math.max(.8,ry*bl));
 mo.setAttribute('d',MOUTH[k]);
 mo.setAttribute('fill',k==='p1'?'#22d3ee':'none');
}

/* ---------- state ---------- */
var hist=[];
var auto=false,busy=false,listening=false,talking=false,ssCount=0,restartT=null,greetUntil=0;
var SS=window.speechSynthesis;
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var rec=null;
var stEl=$('st'),qEl=$('q'),aEl=$('a');

function moodNow(t){
 if(t<greetUntil)return 's';
 if(talking)return Math.sin(t*22)>0?'p1':'p0';
 if(busy)return 't';
 if(listening)return 'l';
 return 's';
}
function gest(t){
 if(t<greetUntil)return [14,-150+Math.sin(t*9)*22];
 if(talking)return [28+Math.sin(t*2.3)*18,-28+Math.sin(t*1.9+1)*18];
 if(busy)return [10,-115+Math.sin(t*3)*4];
 if(listening)return [12,-12];
 return [8+Math.sin(t*1.2)*3,-8-Math.sin(t*1.1)*3];
}
var curL=8,curR=-8,lookC=0,lookT=0,nextBlink=2,blinkEnd=0,lastS='';
function loop(ms){
 var t=ms/1000,g=gest(t);
 curL+=(g[0]-curL)*.12; curR+=(g[1]-curR)*.12;
 armL.setAttribute('transform','translate(78,134) rotate('+curL.toFixed(1)+')');
 armR.setAttribute('transform','translate(162,134) rotate('+curR.toFixed(1)+')');
 lookC+=(lookT-lookC)*.1;
 headG.setAttribute('transform','translate(0,'+(Math.sin(t*2)*1.5).toFixed(2)+') rotate('+(lookC*4).toFixed(1)+' 120 100)');
 bodyG.setAttribute('transform','translate(0,'+(Math.sin(t*2+.5)*1).toFixed(2)+')');
 if(t>nextBlink){blinkEnd=t+.14;nextBlink=t+2.5+Math.random()*3;}
 face(moodNow(t),t<blinkEnd?.1:1,lookC);
 lt.setAttribute('opacity',(.6+.4*Math.sin(t*3)).toFixed(2));
 var s=talking?tx().talk:busy?tx().think:listening?tx().listen:auto?tx().wait:tx().idle;
 if(s!==lastS){stEl.textContent=s;lastS=s;}
 requestAnimationFrame(loop);
}

/* ---------- labels ---------- */
var micBtn=$('micBtn'),langBtn=$('langBtn'),camBtn=$('camBtn'),fullBtn=$('fullBtn');
var camOn=false;
function labels(){
 micBtn.textContent=auto?tx().micOff:tx().micOn; micBtn.className='b'+(auto?' on':'');
 langBtn.textContent=tx().lang;
 camBtn.textContent=camOn?tx().camOff:tx().camOn; camBtn.className='b'+(camOn?' on':'');
 fullBtn.textContent=tx().full;
 lastS='';
}

/* ---------- speech out ---------- */
function pickVoice(l){
 var v=SS.getVoices(),p=l.slice(0,2).toLowerCase(),i;
 for(i=0;i<v.length;i++){if(v[i].lang.replace('_','-').toLowerCase()===l.toLowerCase())return v[i];}
 for(i=0;i<v.length;i++){if(v[i].lang.toLowerCase().indexOf(p)===0)return v[i];}
 return null;
}
function ssSay(txt){
 if(!SS||!txt)return;
 var u=new SpeechSynthesisUtterance(txt);
 var l=/[\u0D00-\u0D7F]/.test(txt)?'ml-IN':/[\u0600-\u06FF]/.test(txt)?'ar-SA':'en-IN';
 u.lang=l; var v=pickVoice(l); if(v)u.voice=v; u.rate=1; u.pitch=1.05;
 u.onend=u.onerror=function(){
  ssCount=Math.max(0,ssCount-1);
  if(ssCount===0){talking=false;setTimeout(maybeListen,500);}
 };
 ssCount++; talking=true; SS.speak(u);
}
function prime(){try{if(SS)SS.speak(new SpeechSynthesisUtterance(''));}catch(e){}}
function clean(s){return s.replace(/[\u0900-\u097F]+/g,'').replace(/[*_#`~>\[\]]/g,'').replace(/\s+/g,' ').trim();}

/* ---------- speech in ---------- */
function recLang(){return LANG==='ml'?'ml-IN':'en-IN';}
function maybeListen(){
 if(!auto||!rec||busy||listening||talking||ssCount>0||t0g())return;
 clearTimeout(restartT);
 restartT=setTimeout(function(){
  if(!auto||busy||listening||talking||ssCount>0)return;
  try{rec.lang=recLang();rec.start();}catch(e){}
 },800);
}
function t0g(){return performance.now()/1000<greetUntil;}
function setupRec(){
 rec=new SR(); rec.lang=recLang(); rec.continuous=false; rec.interimResults=true;
 rec.onstart=function(){listening=true;};
 rec.onend=function(){listening=false;if(auto)maybeListen();};
 rec.onerror=function(e){
  listening=false;
  if(e.error==='not-allowed'||e.error==='service-not-allowed'){auto=false;aEl.textContent=tx().deny;labels();}
 };
 rec.onresult=function(e){
  var s='',fin=false,i;
  for(i=e.resultIndex;i<e.results.length;i++){s+=e.results[i][0].transcript;if(e.results[i].isFinal)fin=true;}
  qEl.textContent=s;
  if(fin)ask(s);
 };
}

/* ---------- ask ---------- */
function ask(text){
 text=(text||'').trim();
 if(!text||busy)return;
 try{if(rec)rec.abort();}catch(e){}
 busy=true; qEl.textContent=text; aEl.textContent='';
 hist.push({role:'user',text:text});
 while(hist.length>9)hist.splice(0,2);
 var full='',pend='',first=true,done=false;

 function speakChunk(c){c=clean(c);if(c)ssSay(c);}
 function pump(final){
  var re=first?/[,.!?;:।،؟…]/:/[.!?।؟…]/,min=first?22:12,i,cut;
  while(true){
   cut=-1;
   for(i=min-1;i<pend.length;i++){if(re.test(pend.charAt(i))){cut=i;break;}}
   if(cut<0)break;
   speakChunk(pend.slice(0,cut+1)); pend=pend.slice(cut+1); first=false;
  }
  if(final&&pend.trim()){speakChunk(pend);pend='';}
 }
 function finish(){
  if(done)return; done=true;
  pump(true);
  if(full.trim()){hist.push({role:'model',text:full});}
  else{hist.pop();aEl.textContent=tx().err;ssSay(tx().err);}
  busy=false;
  if(ssCount===0){talking=false;maybeListen();}
 }
 function fail(c){
  if(done)return; done=true;
  hist.pop(); busy=false;
  var m=c===429?tx().quota:tx().err;
  aEl.textContent=m; ssSay(m);
  if(ssCount===0)maybeListen();
 }
 function handle(line){
  line=line.trim();
  if(line.indexOf('data:')!==0)return;
  var j=line.slice(5).trim();
  if(!j||j==='[DONE]')return;
  try{
   var o=JSON.parse(j);
   var ps=(o.candidates&&o.candidates[0]&&o.candidates[0].content&&o.candidates[0].content.parts)||[];
   ps.forEach(function(p){
    if(p.text){full+=p.text;pend+=p.text;aEl.textContent=clean(full);pump(false);}
   });
  }catch(e){}
 }

 fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(hist)})
 .then(function(r){
  if(!r.ok){fail(r.status);return;}
  var rd=r.body.getReader(),dec=new TextDecoder(),buf='';
  function read(){
   return rd.read().then(function(x){
    if(x.done){if(buf)handle(buf);finish();return;}
    buf+=dec.decode(x.value,{stream:true});
    var lines=buf.split('\n');buf=lines.pop();
    lines.forEach(handle);
    return read();
   });
  }
  return read();
 })
 .catch(function(){if(full)finish();else fail(0);});
}

/* ---------- screen awake ---------- */
function wake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){});}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&(auto||camOn))wake();});

/* ---------- buttons ---------- */
micBtn.onclick=function(){
 if(!SR){aEl.textContent=tx().nosr;return;}
 auto=!auto; prime();
 if(auto){wake();if(!rec)setupRec();maybeListen();}
 else{
  clearTimeout(restartT);
  try{rec.abort();}catch(e){}
  try{SS.cancel();}catch(e){}
  ssCount=0;talking=false;
 }
 labels();
};
langBtn.onclick=function(){
 LANG=LANG==='ml'?'en':'ml';
 try{if(rec&&listening)rec.abort();}catch(e){}
 labels();
};
function isFull(){return document.fullscreenElement||document.webkitFullscreenElement;}
fullBtn.onclick=function(){
 var e=document.documentElement;
 try{
  if(!isFull()){(e.requestFullscreen||e.webkitRequestFullscreen).call(e);}
  else{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
 }catch(x){}
};
function fc(){document.body.className=isFull()?'full':'';}
document.addEventListener('fullscreenchange',fc);
document.addEventListener('webkitfullscreenchange',fc);

/* ---------- camera: greet when someone appears ---------- */
var vid=$('cam'),stream=null,det=null,camTimer=null,prevG=null;
var cvs=document.createElement('canvas'),cx=null;
var hereN=0,goneN=0,personHere=false,lastGreet=0;
function lookAt(frac){lookT=Math.max(-1,Math.min(1,-(frac-.5)*2));}
function greet(){
 var now=Date.now();
 if(busy||talking||ssCount>0||now-lastGreet<30000)return;
 lastGreet=now;
 greetUntil=performance.now()/1000+4;
 try{if(rec&&listening)rec.abort();}catch(e){}
 aEl.textContent=tx().hello;
 (tx().hello.match(/[A-Za-z]+|[^A-Za-z]+/g)||[]).forEach(function(p){p=p.trim();if(p)ssSay(p);});
}
function seen(yes){
 if(yes){hereN++;goneN=0;}else{goneN++;hereN=0;}
 if(!personHere&&hereN>=2){personHere=true;greet();}
 if(personHere&&goneN>=10){personHere=false;lookT=0;}
 if(!yes&&goneN>=4)lookT=0;
}
function camTick(){
 if(!vid.videoWidth||vid.readyState<2)return;
 if(det){
  det.detect(vid).then(function(f){
   if(f.length){var b=f[0].boundingBox;lookAt((b.x+b.width/2)/vid.videoWidth);}
   seen(f.length>0);
  }).catch(function(){det=null;});
  return;
 }
 cx.drawImage(vid,0,0,64,48);
 var d=cx.getImageData(0,0,64,48).data,N=64*48,g=new Uint8Array(N),i,diff=0,sx=0;
 for(i=0;i<N;i++){
  g[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/3;
  if(prevG&&Math.abs(g[i]-prevG[i])>28){diff++;sx+=(i%64);}
 }
 prevG=g;
 var yes=diff>N*.035;
 if(yes)lookAt((sx/diff)/64);
 seen(yes);
}
function camStart(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){aEl.textContent=tx().nocam;return;}
 prime();
 navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:320},height:{ideal:240}},audio:false})
 .then(function(s){
  stream=s;vid.srcObject=s;vid.play();vid.style.display='block';camOn=true;wake();
  if('FaceDetector' in window){try{det=new FaceDetector({fastMode:true,maxDetectedFaces:1});}catch(e){det=null;}}
  cvs.width=64;cvs.height=48;cx=cvs.getContext('2d',{willReadFrequently:true});
  prevG=null;hereN=0;goneN=0;personHere=false;
  camTimer=setInterval(camTick,500);
  labels();
 })
 .catch(function(){aEl.textContent=tx().camdeny;});
}
function camStop(){
 clearInterval(camTimer);
 if(stream)stream.getTracks().forEach(function(t){t.stop();});
 stream=null;vid.style.display='none';camOn=false;personHere=false;lookT=0;labels();
}
camBtn.onclick=function(){if(camOn)camStop();else camStart();};

labels();
requestAnimationFrame(loop);
</script>
</body>
</html>
